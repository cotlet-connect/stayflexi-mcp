[project]
name = "stayflexi-mcp"
version = "1.1.0"
description = "Connect Stayflexi to Claude Code, ChatGPT and any AI agent through Cotlet.dev, a hosted MCP server. No Stayflexi API key needed."
readme = "README.md"
license = "Elastic-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Cotlet.dev", email = "contact@cotlet.dev" }]
keywords = ["stayflexi", "stayflexi api", "stayflexi mcp", "mcp server", "claude", "chatgpt", "ai agent", "cotlet"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Office/Business"]
dependencies = []

[project.urls]
Homepage = "https://cotlet.dev/integrations/stayflexi-api-mcp-server?utm_source=pypi&utm_medium=package&utm_campaign=stayflexi"
Source = "https://github.com/cotlet-connect/stayflexi-mcp"

[project.scripts]
stayflexi-mcp = "stayflexi_agent:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"stayflexi_agent.py" = "stayflexi_agent.py"

[tool.hatch.build.targets.sdist]
include = ["stayflexi_agent.py", "README.md", "LICENSE", "mcp.json", "Dockerfile", "glama.json", "skills", "examples", ".cursor"]
